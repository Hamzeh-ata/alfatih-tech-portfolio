<section class="section">
  <div class="container">
    <p class="section-label">{{ 'productsPage.label' | t }}</p>
    <h1 class="section-title">{{ 'productsPage.title' | t }}</h1>
    <p class="section-lead">{{ 'productsPage.lead' | t }}</p>

    <div class="products-grid">
      @for (product of products; track product.id; let i = $index) {
        <div class="products-grid__item" [class.is-lead]="i === 0">
          <app-product-card [product]="product" [featured]="i === 0" />
        </div>
      }
    </div>
  </div>
</section>
